{% extends "base.html" %}
{% block title %}登录 · 报关申报系统{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <span class="brand-mark large">关</span>
      <h1>报关申报系统</h1>
      <p class="muted">本地模拟环境，请使用演示账号登录</p>
    </div>
    {% if expired %}<div class="alert alert-warn">会话已过期（{{ ttl_minutes }} 分钟无操作自动退出），请重新登录。</div>{% endif %}
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login') }}" class="stack">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="field">
        <span>用户名</span>
        <input name="username" id="username" autocomplete="username" required value="demo">
      </label>
      <label class="field">
        <span>密码</span>
        <input name="password" id="password" type="password" autocomplete="current-password" required value="demo123">
      </label>
      <button class="btn btn-primary btn-block" id="login-btn" type="submit">登 录</button>
    </form>
    <p class="hint">演示账号 demo / demo123　会话有效期 {{ ttl_minutes }} 分钟</p>
  </div>
</div>
{% endblock %}
