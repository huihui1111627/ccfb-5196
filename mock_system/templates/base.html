<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}海关申报系统{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='mock.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">关</span>
    <span>中国海关 · 进出口货物申报系统 <small>MOCK</small></span>
  </div>
  <nav>
    {% if current_user %}
      <a href="/declarations">申报单管理</a>
      <a href="/query">申报查询</a>
      <a href="/declaration/new">新建申报</a>
      <span class="user">{{ current_user['display_name'] }}</span>
      <form method="post" action="/logout" class="inline"><button class="link">退出</button></form>
    {% endif %}
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer class="footer">
  <span>模拟环境，仅用于报关自动化联调</span>
  <span>会话时限 {{ session_seconds // 60 }} 分钟</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
